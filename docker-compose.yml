version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telecom-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    command: streamlit run dashboard/app.py --server.address=0.0.0.0

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telecom-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: sh -c "python train_model.py && uvicorn api.app:app --host 0.0.0.0 --port 8000"
    depends_on:
      - dashboard
